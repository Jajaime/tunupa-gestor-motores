name: Tunupa - Distroless Candidate Preflight (no publish)

on:
  workflow_dispatch:

# 18c4: independiente del candidato Debian actual. Nunca hace push a GHCR.
permissions:
  contents: read

concurrency:
  group: tunupa-distroless-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Build and assess Distroless candidates (no push)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Audit runtime npm dependencies (blocking)
        shell: bash
        run: |
          set -euo pipefail
          for service in api web simulator; do
            (cd "apps/$service" && npm audit --omit=dev --audit-level=low)
          done

      # The tags below intentionally match scripts/ci/candidate_evidence.py.
      # They exist ONLY in this ephemeral GitHub runner and are never pushed.
      - name: Build API Distroless candidate
        run: >-
          docker build --pull -f apps/api/Dockerfile.distroless-eval
          -t tunupa-api:release-candidate ./apps/api
      - name: Build Web Distroless candidate (NOT deployable)
        run: >-
          docker build --pull -f apps/web/Dockerfile.distroless-eval
          --build-arg NEXT_PUBLIC_API_URL=https://example.invalid/api/v1
          -t tunupa-web:release-candidate ./apps/web

      - name: Smoke test native argon2 under restricted runtime
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --pull=never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --pids-limit 256 --memory 768m \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m,uid=1000,gid=1000,mode=1777 \
            --entrypoint /nodejs/bin/node tunupa-api:release-candidate \
            -e 'const a=require("argon2");a.hash("tunupa-smoke").then(h=>a.verify(h,"tunupa-smoke")).then(ok=>{if(!ok)process.exitCode=1;else console.log("argon2 OK")}).catch(e=>{console.error(e.message);process.exitCode=1})'

      - name: Smoke test isolated Next.js HTTP startup
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --pull=never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --pids-limit 256 --memory 768m \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m,uid=1000,gid=1000,mode=1777 \
            --tmpfs /app/.next/cache:rw,nosuid,nodev,noexec,size=128m,uid=1000,gid=1000,mode=0700 \
            -e NODE_ENV=production -e PORT=3000 -e HOSTNAME=127.0.0.1 \
            --entrypoint /nodejs/bin/node tunupa-web:release-candidate \
            -e 'require("./server.js");(async()=>{for(let i=0;i<25;i++){try{const r=await fetch("http://127.0.0.1:3000/");if(r.ok){console.log("Next.js OK: "+r.status);process.exit(0)}else{console.error("HTTP "+r.status);process.exit(1)}}catch{}await new Promise(done=>setTimeout(done,400))}console.error("Next.js no responde");process.exit(1)})().catch(e=>{console.error(e.message);process.exit(1)})'

      # A Distroless image does not contain /bin/sh or dpkg. Do NOT use the
      # old shell-based inspect_runtime_exposure.py for these candidates.
      - name: Inspect exact Distroless images without a shell
        run: >-
          python3 scripts/security/inspect_distroless_candidate.py
          --output runtime-exposure-release.md

      - name: Scan API Distroless candidate with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: tunupa-api:release-candidate
          scanners: vuln
          severity: HIGH,CRITICAL
          format: json
          output: trivy-release-api.json
          exit-code: '0'

      - name: Scan Web Distroless candidate with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: tunupa-web:release-candidate
          scanners: vuln
          severity: HIGH,CRITICAL
          format: json
          output: trivy-release-web.json
          exit-code: '0'

      - name: Generate API CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: tunupa-api:release-candidate
          format: cyclonedx
          output: sbom-release-api.cdx.json
          exit-code: '0'

      - name: Generate Web CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: tunupa-web:release-candidate
          format: cyclonedx
          output: sbom-release-web.cdx.json
          exit-code: '0'

      - name: Link Trivy and SBOM to inspected image IDs
        run: >-
          python3 scripts/ci/candidate_evidence.py
          --api trivy-release-api.json
          --web trivy-release-web.json
          --api-sbom sbom-release-api.cdx.json
          --web-sbom sbom-release-web.cdx.json
          --runtime runtime-exposure-release.md
          --output candidate-evidence.json

      - name: Block critical and fixable high findings
        run: >-
          python3 scripts/ci/release_scan_gate.py
          trivy-release-api.json trivy-release-web.json

      - name: Check unexpected and historically pending CVEs
        run: >-
          python3 scripts/ci/cve_risk_inventory.py
          security/pending-high-cves.json
          trivy-release-api.json trivy-release-web.json

      - name: Distroless candidate is NOT a release authorization
        shell: bash
        run: |
          echo '### Tunupa — evaluación Distroless sin publicación' >> "$GITHUB_STEP_SUMMARY"
          echo '- **NO AUTORIZADO PARA GHCR.** El CI no valida el VPS ni la independencia del aprobador.' >> "$GITHUB_STEP_SUMMARY"
          echo '- CVE históricas: conservar el expediente; verificar eliminación real mediante SBOM.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Bundle Web de prueba: example.invalid; nunca desplegar esta imagen.' >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve Distroless candidate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tunupa-distroless-candidate-evidence-${{ github.sha }}
          path: |
            trivy-release-api.json
            trivy-release-web.json
            sbom-release-api.cdx.json
            sbom-release-web.cdx.json
            runtime-exposure-release.md
            candidate-evidence.json
          if-no-files-found: warn
          retention-days: 14
