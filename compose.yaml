services:
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: gestor-motores-mosquitto
    restart: unless-stopped

    ports:
      - "1883:1883"

    volumes:
      - ./infrastructure/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infrastructure/mosquitto/config/passwords:/mosquitto/config/passwords:ro
      - ./infrastructure/mosquitto/config/acl:/mosquitto/config/acl:ro
      - mosquitto_data:/mosquitto/data

    networks:
      - gestor_motores_network

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: gestor-motores-timescaledb
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./infrastructure/database/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - gestor_motores_network

  grafana:
    image: grafana/grafana:12.2.0
    container_name: gestor-motores-grafana
    restart: unless-stopped

    depends_on:
      timescaledb:
        condition: service_healthy

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Definir GRAFANA_ADMIN_USER en .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Definir GRAFANA_ADMIN_PASSWORD en .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT:-3001}
      GRAFANA_PG_DATABASE: ${POSTGRES_DB}
      GRAFANA_PG_USER: grafana_reader
      GRAFANA_PG_PASSWORD: ${GRAFANA_DB_PASSWORD:?Definir GRAFANA_DB_PASSWORD en .env}

    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards/tunupa:ro

    networks:
      - gestor_motores_network

volumes:
  grafana_data:
    name: gestor-motores-grafana-data

  timescaledb_data:
    name: gestor-motores-timescaledb-data

  mosquitto_data:
    name: gestor-motores-mosquitto-data

networks:
  gestor_motores_network:
    name: gestor-motores-network
    driver: bridge