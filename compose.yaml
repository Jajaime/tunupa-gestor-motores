services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: gestor-motores-timescaledb
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./infrastructure/database/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - gestor_motores_network

volumes:
  timescaledb_data:
    name: gestor-motores-timescaledb-data

networks:
  gestor_motores_network:
    name: gestor-motores-network
    driver: bridge